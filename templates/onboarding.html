<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - Setup Your Semester</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; color: white; }
        .setup-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 40px; }
        .subject-item { background: white; color: #333; border-radius: 10px; margin-bottom: 10px; transition: 0.3s; cursor: pointer; }
        .subject-item:hover { transform: scale(1.02); background: #f0f0f0; }
        .btn-start { background: #00d2ff; border: none; font-weight: bold; padding: 15px; border-radius: 10px; }
    </style>
</head>
<body>

<div class="container py-5 d-flex justify-content-center">
    <div class="setup-card col-lg-6 col-md-8 col-12 shadow-lg">
        <h2 class="text-center mb-2">Welcome, Daivik! 🎓</h2>
        <p class="text-center opacity-75 mb-4">Select the subjects you're tackling this semester.</p>

        <form action="/onboarding" method="POST">
            <div class="mb-4">
                {% for subject in subjects %}
                <div class="subject-item p-3 shadow-sm d-flex align-items-center">
                    <input class="form-check-input me-3" type="checkbox" name="subjects" value="{{ subject }}" id="{{ subject }}">
                    <label class="form-check-label w-100 mb-0" for="{{ subject }}">
                        <strong>{{ subject }}</strong>
                    </label>
                </div>
                {% endfor %}
            </div>

            <div class="text-center">
                <button type="submit" class="btn btn-start w-100 text-white shadow">
                    INITIALIZE MY STUDY ENGINE 🚀
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
