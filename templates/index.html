<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .banner { border-radius: 10px; padding: 20px; margin-bottom: 20px; color: white; }
    </style>
</head>
<body>

<div class="container py-5">
    <h1 class="mb-4">Hello, Daivik! 👋</h1>

    {% if needs_checkin %}
    <div class="card p-4">
        <h3 class="mb-3">Morning Check-in</h3>
        <form action="/submit_checkin" method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Sleep Hours</label>
                    <input type="number" step="0.1" name="sleep" class="form-control" required placeholder="e.g. 7.5">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Sleep Quality</label>
                    <select name="quality" class="form-select">
                        <option>Good</option>
                        <option>Poor</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Energy Level (1-5)</label>
                    <input type="range" name="energy" min="1" max="5" class="form-range">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Prev Quiz Score (%)</label>
                    <input type="number" name="quiz" class="form-control" required placeholder="0-100">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Days to Exam</label>
                    <input type="number" name="exam_days" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4 w-100">Generate Study Plan</button>
        </form>
    </div>

    {% else %}
    <div class="banner bg-{{ color }}">
        <h2 class="m-0">{{ banner }}</h2>
        <p class="m-0 opacity-75">Based on your energy level and stats for today.</p>
    </div>

    <div class="card p-4 mb-4">
        <h4 class="mb-3">Your Focus Tasks:</h4>
        <ul class="list-group list-group-flush">
            {% for task in tasks %}
            <li class="list-group-item py-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="task{{ loop.index }}">
                    <label class="form-check-label fs-5" for="task{{ loop.index }}">
                        {{ task }}
                    </label>
                </div>
            </li>
            {% endfor %}
        </ul>
    </div>

    <a href="/" class="btn btn-outline-secondary">Log New Stats (Reset)</a>
    {% endif %}
</div>

</body>
</html>
